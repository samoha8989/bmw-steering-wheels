<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'self'; object-src 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#111316">
<title>Статистика сайта</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#111316;--card:#1a1d22;--card2:#22262d;--ink:#f1f2f4;--muted:#9ca2ad;--line:#2a2f37;--blue:#4f7bff;--green:#4fc17f;--lime:#c6f432;--orange:#f2a541;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 12px}.muted{color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button,.btn{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue)}
.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:28px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:500;font-size:12px}td.n,th.n{text-align:right;white-space:nowrap}
.scroll{max-height:460px;overflow:auto}
.bar{position:relative;height:8px;background:var(--card2);border-radius:4px;min-width:60px}.bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:4px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big2 div{background:var(--card2);border-radius:12px;padding:12px}.big2 b{font-size:26px;display:block}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chips div{background:var(--card2);border-radius:12px;padding:10px;text-align:center}.chips b{font-size:22px;display:block}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#d9dbdf;display:block}
.chart{width:100%;height:220px;display:block}.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.login input[type=password]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:12px 0}
.err{color:#ff7a7a;min-height:1.4em}.note{font-size:13px;color:var(--muted);margin-top:10px}
.hours{display:flex;align-items:flex-end;gap:2px;height:90px}.hours i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;min-height:1px}
.hlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}.tag.stock{color:var(--green)}
@media (max-width:600px){.kpi b{font-size:23px}.two{grid-template-columns:1fr}td,th{padding:6px 4px}.hide-m{display:none}}
</style></head><body>
<div id="app" class="wrap"><p class="muted">Загрузка…</p></div>
<script src="stats-config.js"></script>
<script src="stats.js"></script>
</body></html>
